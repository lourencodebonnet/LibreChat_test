version: 1.3.5
cache: true

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openrouter/free"
        fetch: true
      titleConvo: true
      titleModel: "openrouter/free"
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter"