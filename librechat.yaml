version: 1.3.5
cache: true

interface:
  welcomeMessage: "Hallo {{user.name}}, willkommen bei Greif & Contzen GPT."
  customWelcome: "Guten Tag {{user.name}}, willkommen bei Greif & Contzen GPT."
  appTitle: "Greif & Contzen GPT"
  termsOfService:
    modalAcceptance: false


endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openrouter/free"
        fetch: true
      titleConvo: true
      titleModel: "openrouter/free"
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter"